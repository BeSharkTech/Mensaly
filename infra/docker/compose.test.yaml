name: mensaly-test

services:
  postgres-test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mensaly_test
      POSTGRES_USER: mensaly_test
      POSTGRES_PASSWORD: mensaly_test_local
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mensaly_test -d mensaly_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis-test:
    image: redis:7.2-bookworm
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s
