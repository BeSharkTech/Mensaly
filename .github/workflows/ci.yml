name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mensaly_test:mensaly_test_local@localhost:55432/mensaly_test?schema=public
      REDIS_URL: redis://localhost:56379

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example -f infra/docker/compose.yaml config --quiet
          docker compose -f infra/docker/compose.test.yaml config --quiet
          cat > .phase1.compose.env <<'EOF'
          DATABASE_URL=postgresql://mensaly:mensaly_local@database.example:5432/mensaly
          REDIS_URL=rediss://redis.example:6379
          CORS_ORIGINS=https://app.example.com
          PUBLIC_API_URL=https://api.example.com
          PUBLIC_WEB_URL=https://app.example.com
          S3_ENDPOINT=https://account.r2.cloudflarestorage.com
          S3_BUCKET=mensaly-files
          S3_ACCESS_KEY_ID=non-secret-ci-value
          S3_SECRET_ACCESS_KEY=non-secret-ci-value
          RESEND_API_KEY=re_non-secret-ci-value
          RESEND_FROM_EMAIL=ci@example.com
          RESEND_WEBHOOK_SECRET=whsec_non-secret-ci-value
          EMAIL_ENCRYPTION_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
          EOF
          docker compose --env-file .phase1.compose.env -f infra/docker/compose.app.yaml config --quiet
          rm .phase1.compose.env

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Start isolated test services
        run: pnpm env:test:up

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Test database integration
        run: pnpm test:integration

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test compiled runtimes
        run: pnpm test:runtime

      - name: Stop isolated test services
        if: always()
        run: pnpm env:test:down
