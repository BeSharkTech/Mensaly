name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mensaly_test:mensaly_test_local@localhost:55432/mensaly_test?schema=public
      REDIS_URL: redis://localhost:56379

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example -f infra/docker/compose.yaml config --quiet
          docker compose -f infra/docker/compose.test.yaml config --quiet

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated test services
        run: pnpm env:test:up

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Test database integration
        run: pnpm test:integration

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test compiled API runtime
        run: pnpm test:runtime

      - name: Stop isolated test services
        if: always()
        run: pnpm env:test:down
