packages:
  - apps/*
  - packages/*

overrides:
  '@fastify/static': 10.1.2
  'fast-uri@>=3.0.0 <4.0.0': 3.1.5
  'fast-uri@>=4.0.0 <5.0.0': 4.1.2
  'brace-expansion@>=5.0.0 <6.0.0': 5.0.9
  find-my-way: 9.7.0
  js-yaml: 5.2.2
  postcss: 8.5.23
  sharp: 0.35.3

peerDependencyRules:
  allowedVersions:
    '@fastify/static': 10.1.2

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1099.0'
