packages:
  - apps/*
  - packages/*

overrides:
  '@fastify/static': 10.1.2
  find-my-way: 9.7.0
  js-yaml: 5.2.2
  postcss: 8.5.23
  sharp: 0.35.3

peerDependencyRules:
  allowedVersions:
    '@fastify/static': 10.1.2

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false
